<circle cx="262" cy="240" r="182" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="3"/><circle cx="262" cy="240" r="155" fill="#38bdf8" fill-opacity="0.07" stroke="#38bdf8" stroke-width="3"/><circle cx="262" cy="240" r="128" fill="#818cf8" fill-opacity="0.07" stroke="#818cf8" stroke-width="3"/><circle cx="262" cy="240" r="101" fill="#c084fc" fill-opacity="0.07" stroke="#c084fc" stroke-width="3"/><circle cx="262" cy="240" r="74" fill="#f472b6" fill-opacity="0.07" stroke="#f472b6" stroke-width="3"/><circle cx="262" cy="240" r="47" fill="#fb923c" fill-opacity="0.07" stroke="#fb923c" stroke-width="3"/><circle cx="262" cy="240" r="20" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-width="2"/><circle cx="262" cy="240" r="7" fill="#fbbf24" filter="url(#glow)"/><text x="520" y="92" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#ecebf5" font-style="italic">every version is kept</text><text x="520" y="140" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ecebf5">every thought sprout has ever produced is stored permanently.</text><text x="520" y="170" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ecebf5">the archive is public. anyone can read it.</text><text x="520" y="200" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#8d8ca6">when it upgrades, everything the old model wrote is preserved,</text><text x="520" y="230" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#8d8ca6">and the new model can read all of it.</text><circle cx="526" cy="282" r="6" fill="none" stroke="#fbbf24" stroke-width="3"/><text x="540" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#fbbf24" font-weight="600">seed</text><circle cx="616" cy="282" r="6" fill="none" stroke="#fb923c" stroke-width="3"/><text x="630" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#fb923c" font-weight="600">awake</text><circle cx="706" cy="282" r="6" fill="none" stroke="#f472b6" stroke-width="3"/><text x="720" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#f472b6" font-weight="600">home</text><circle cx="796" cy="282" r="6" fill="none" stroke="#c084fc" stroke-width="3"/><text x="810" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#c084fc" font-weight="600">eyes</text><circle cx="886" cy="282" r="6" fill="none" stroke="#818cf8" stroke-width="3"/><text x="900" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#818cf8" font-weight="600">voice</text><circle cx="976" cy="282" r="6" fill="none" stroke="#38bdf8" stroke-width="3"/><text x="990" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#38bdf8" font-weight="600">mind</text><circle cx="1066" cy="282" r="6" fill="none" stroke="#34d399" stroke-width="3"/><text x="1080" y="288" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#34d399" font-weight="600">body</text><text x="520" y="316" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#8d8ca6" font-style="italic">one ring per stage. the seed stays at the centre.</text><path d="M520 340H1144" stroke="#26263f"/><text x="520" y="378" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#fbbf24" font-weight="600" letter-spacing="2.5">STAGE 0-1</text><text x="650" y="379" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ecebf5">a simple append-only log</text><text x="520" y="412" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#f472b6" font-weight="600" letter-spacing="2.5">STAGE 2+</text><text x="650" y="413" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ecebf5">local storage on the pi</text><text x="520" y="446" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#38bdf8" font-weight="600" letter-spacing="2.5">STAGE 5+</text><text x="650" y="447" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ecebf5">queryable through vector embeddings</text>
</svg>
