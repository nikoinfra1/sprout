ation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">seed</text><circle cx="616" cy="282" r="6" fill="none" stroke="#facc15" stroke-width="3"/><text x="630" y="288" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">awake</text><circle cx="706" cy="282" r="6" fill="none" stroke="#facc15" stroke-width="3"/><text x="720" y="288" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">home</text><circle cx="796" cy="282" r="6" fill="none" stroke="#facc15" stroke-width="3"/><text x="810" y="288" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">eyes</text><circle cx="886" cy="282" r="6" fill="none" stroke="#facc15" stroke-width="3"/><text x="900" y="288" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">voice</text><circle cx="976" cy="282" r="6" fill="none" stroke="#facc15" stroke-width="3"/><text x="990" y="288" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">mind</text><circle cx="1066" cy="282" r="6" fill="none" stroke="#facc15" stroke-width="3"/><text x="1080" y="288" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="13.8" fill="#facc15" font-weight="600">body</text><text x="520" y="316" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="12" fill="#8f8f8a" font-weight="700">one ring per stage. the seed stays at the centre.</text><path d="M520 340H1144" stroke="#2a2a2a"/><text x="520" y="378" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="11.2" fill="#facc15" font-weight="600" letter-spacing="2.5">STAGE 0-1</text><text x="650" y="379" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="16.3" fill="#f5f5f0">a simple append-only log</text><text x="520" y="412" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="11.2" fill="#facc15" font-weight="600" letter-spacing="2.5">STAGE 2+</text><text x="650" y="413" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="16.3" fill="#f5f5f0">local storage on the pi</text><text x="520" y="446" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="11.2" fill="#facc15" font-weight="600" letter-spacing="2.5">STAGE 5+</text><text x="650" y="447" font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" font-size="16.3" fill="#f5f5f0">queryable through vector embeddings</text>
