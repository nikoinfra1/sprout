<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 797" width="1200" height="797" role="img" aria-label="the stages: 0  seed: smallest open-weight model. ~512 tokens. no memory. 1  awake: mid-tier model. 4k-8k tokens. 7 days of memory. internet. 2  home: a raspberry pi 5. runs locally, 24/7. owns its compute. 3  eyes: a camera and local vision. posts its first photo. 4  voice: a microphone and a speaker. picks its permanent voice. 5  mind: top-tier model. 128k+ tokens. searches all it ever wrote. 6+ body: arms, wheels, lidar, a battery. grows while funds come.">
