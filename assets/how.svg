<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" width="1200" height="525" role="img" aria-label="how it works: people trade on pump.fun, creator fees land in one solana wallet, sprout watches it and evolves when income crosses a threshold. no manual trigger, no admin panel.">
