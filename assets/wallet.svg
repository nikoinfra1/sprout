<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 389" width="1200" height="389" role="img" aria-label="the wallet: one solana wallet, read straight from the chain. thresholds t1 to t6 count total lifetime income, not the current balance. when one is crossed the upgrade happens and its cost is deducted.">
<rect width="1200" height="389" rx="10" fill="#000000"/>
<rect x="0.5" y="0.5" width="1199" height="388" rx="10" fill="none" stroke="#2b2506"/>
<g font-family="Consolas,'SF Mono',SFMono-Regular,Menlo,'Liberation Mono','Courier New',monospace" xml:space="preserve">
<text x="60.0" y="73.2" font-size="20" textLength="156.0" lengthAdjust="spacing" fill="#facc15" font-weight="700">//&#160;the&#160;wallet</text>
<text x="60.0" y="127.6" font-size="20" textLength="180.0" lengthAdjust="spacing" fill="#9c8212">lifetime&#160;income</text>
<text x="84.0" y="154.8" font-size="20" textLength="984.0" lengthAdjust="spacing" fill="#facc15">0&#160;--------&#160;t1&#160;--------&#160;t2&#160;--------&#160;t3&#160;--------&#160;t4&#160;--------&#160;t5&#160;--------&#160;t6&#160;-------&gt;</text>
<text x="84.0" y="182.0" font-size="20" textLength="948.0" lengthAdjust="spacing" fill="#facc15">|&#160;&#160;&#160;seed&#160;&#160;&#160;|&#160;&#160;&#160;awake&#160;&#160;&#160;|&#160;&#160;&#160;&#160;home&#160;&#160;&#160;|&#160;&#160;&#160;&#160;eyes&#160;&#160;&#160;|&#160;&#160;&#160;voice&#160;&#160;&#160;|&#160;&#160;&#160;&#160;mind&#160;&#160;&#160;|&#160;&#160;&#160;body</text>
<text x="84.0" y="236.4" font-size="20" textLength="792.0" lengthAdjust="spacing" fill="#facc15">one&#160;solana&#160;wallet.&#160;the&#160;creator&#160;fee&#160;recipient&#160;on&#160;the&#160;bonding&#160;curve.</text>
<text x="84.0" y="263.6" font-size="20" textLength="612.0" lengthAdjust="spacing" fill="#facc15">read&#160;straight&#160;from&#160;the&#160;chain.&#160;no&#160;oracle.&#160;no&#160;bridge.</text>
<text x="60.0" y="318.0" font-size="20" textLength="768.0" lengthAdjust="spacing" fill="#9c8212">thresholds&#160;count&#160;total&#160;lifetime&#160;income,&#160;not&#160;the&#160;current&#160;balance.</text>
<text x="60.0" y="345.2" font-size="20" textLength="792.0" lengthAdjust="spacing" fill="#9c8212">when&#160;one&#160;is&#160;crossed,&#160;the&#160;upgrade&#160;happens&#160;and&#160;its&#160;cost&#160;is&#160;deducted.</text>
</g>
</svg>
